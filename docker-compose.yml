services:
  db:
    image: postgis/postgis:16-3.4
    container_name: db
    restart: always
    environment:
      - POSTGRES_DB=fitness_app
      - POSTGRES_USER=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
    driver: local
